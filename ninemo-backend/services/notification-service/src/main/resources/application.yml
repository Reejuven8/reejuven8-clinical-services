server:
  port: 8085
spring:
  application:
    name: notification-service
  datasource:
    # IS-039: must NOT be reejuven8_ninemo — ninemo-clinical-service owns that database and
    # runs its own Flyway V1–V8 there. Sharing it made the two flyway_schema_history tables
    # collide: whichever service migrated first won, the other died on checksum mismatch.
    url: ${DB_NOTIFICATION_URL:jdbc:postgresql://localhost:5432/reejuven8_notification}
    username: ${DB_USERNAME:reejuven8}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:reejuven8}
    password: ${RABBITMQ_PASSWORD:dev_password}
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  sms-from: ${TWILIO_SMS_FROM:}
  # Public URL Twilio posts delivery statuses to; also used to verify X-Twilio-Signature
  status-callback-url: ${TWILIO_STATUS_CALLBACK_URL:}
firebase:
  server-key: ${FCM_SERVER_KEY:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

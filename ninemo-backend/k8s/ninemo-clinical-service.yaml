apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninemo-clinical-service
  namespace: ninemo
spec:
  replicas: 2
  selector:
    matchLabels: { app: ninemo-clinical-service }
  template:
    metadata:
      labels: { app: ninemo-clinical-service }
    spec:
      containers:
        - name: ninemo-clinical-service
          image: ninemo/ninemo-clinical-service:latest
          ports: [{ containerPort: 8084 }]
          envFrom:
            - configMapRef: { name: ninemo-config }
            - secretRef: { name: ninemo-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8084 }
            initialDelaySeconds: 80
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 1000m, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ninemo-clinical-service
  namespace: ninemo
spec:
  selector: { app: ninemo-clinical-service }
  ports: [{ port: 8084, targetPort: 8084 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ninemo-clinical-service-hpa
  namespace: ninemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ninemo-clinical-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

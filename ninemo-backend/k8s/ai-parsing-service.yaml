apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-parsing-service
  namespace: ninemo
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-parsing-service }
  template:
    metadata:
      labels: { app: ai-parsing-service }
    spec:
      containers:
        - name: ai-parsing-service
          image: ninemo/ai-parsing-service:latest
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: ninemo-config }
            - secretRef: { name: ninemo-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8083 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2000m, memory: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-parsing-service
  namespace: ninemo
spec:
  selector: { app: ai-parsing-service }
  ports: [{ port: 8083, targetPort: 8083 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-parsing-service-hpa
  namespace: ninemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-parsing-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }

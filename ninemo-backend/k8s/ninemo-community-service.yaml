apiVersion: apps/v1
kind: Deployment
metadata:
  name: ninemo-community-service
  namespace: ninemo
spec:
  replicas: 2
  selector:
    matchLabels: { app: ninemo-community-service }
  template:
    metadata:
      labels: { app: ninemo-community-service }
    spec:
      containers:
        - name: ninemo-community-service
          image: ninemo/ninemo-community-service:latest
          ports: [{ containerPort: 8086 }]
          envFrom:
            - configMapRef: { name: ninemo-config }
            - secretRef: { name: ninemo-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ninemo-community-service
  namespace: ninemo
spec:
  selector: { app: ninemo-community-service }
  ports: [{ port: 8086, targetPort: 8086 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ninemo-community-service-hpa
  namespace: ninemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ninemo-community-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

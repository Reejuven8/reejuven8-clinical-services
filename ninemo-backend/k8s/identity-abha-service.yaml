apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-abha-service
  namespace: ninemo
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity-abha-service }
  template:
    metadata:
      labels: { app: identity-abha-service }
    spec:
      containers:
        - name: identity-abha-service
          image: ninemo/identity-abha-service:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: ninemo-config }
            - secretRef: { name: ninemo-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-abha-service
  namespace: ninemo
spec:
  selector: { app: identity-abha-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity-abha-service-hpa
  namespace: ninemo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity-abha-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

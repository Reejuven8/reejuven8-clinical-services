version: "3.9"

networks:
  reejuven8-network:
    driver: bridge

services:
  # ─────────────────────────────────────────────
  # Infrastructure services (inline from infra)
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: reejuven8-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reejuven8
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: reejuven8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reejuven8"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  mongodb:
    image: mongo:7
    container_name: reejuven8-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reejuven8
      MONGO_INITDB_ROOT_USERNAME: reejuven8
      MONGO_INITDB_ROOT_PASSWORD: dev_password
    volumes:
      - mongodb-data:/data/db
      - ./init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  redis:
    image: redis:7-alpine
    container_name: reejuven8-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: reejuven8-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - reejuven8-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: reejuven8-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - reejuven8-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reejuven8-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: reejuven8
      RABBITMQ_DEFAULT_PASS: dev_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  # ─────────────────────────────────────────────
  # Application services
  # ─────────────────────────────────────────────

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: reejuven8-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_use_strong_secret}
      IDENTITY_SERVICE_URL: http://identity-abha-service:8081
      HEALTH_DATA_SERVICE_URL: http://health-data-service:8082
      AI_PARSING_SERVICE_URL: http://ai-parsing-service:8083
      CLINICAL_SERVICE_URL: http://ninemo-clinical-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      COMMUNITY_SERVICE_URL: http://ninemo-community-service:8086
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

  identity-abha-service:
    build:
      context: ./services/identity-abha-service
    container_name: reejuven8-identity-abha
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reejuven8_identity
      DB_USER: reejuven8
      DB_PASS: dev_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

  health-data-service:
    build:
      context: ./services/health-data-service
    container_name: reejuven8-health-data
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://reejuven8:dev_password@mongodb:27017/reejuven8?authSource=admin
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: reejuven8
      RABBITMQ_PASSWORD: dev_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

  ai-parsing-service:
    build:
      context: ./services/ai-parsing-service
    container_name: reejuven8-ai-parsing
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: reejuven8
      RABBITMQ_PASSWORD: dev_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - reejuven8-network

  ninemo-clinical-service:
    build:
      context: ./services/ninemo-clinical-service
    container_name: reejuven8-clinical
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Env var names must match the ${...} placeholders in each service's application.yml.
      DB_NINEMO_URL: jdbc:postgresql://postgres:5432/reejuven8_ninemo
      DB_USERNAME: reejuven8
      DB_PASSWORD: dev_password
      MONGO_URI: mongodb://reejuven8:dev_password@mongodb:27017/reejuven8?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: reejuven8
      RABBITMQ_PASSWORD: dev_password
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: reejuven8-notification
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # IS-039: own database, not reejuven8_ninemo (clinical owns that one's Flyway history).
      DB_NOTIFICATION_URL: jdbc:postgresql://postgres:5432/reejuven8_notification
      DB_USERNAME: reejuven8
      DB_PASSWORD: dev_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: reejuven8
      RABBITMQ_PASSWORD: dev_password
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

  ninemo-community-service:
    build:
      context: ./services/ninemo-community-service
    container_name: reejuven8-community
    ports:
      - "8086:8086"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://reejuven8:dev_password@mongodb:27017/reejuven8?authSource=admin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - reejuven8-network

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  rabbitmq-data:

version: "3.9"

networks:
  reejuven8-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: reejuven8-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: reejuven8
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: reejuven8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reejuven8"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  mongodb:
    image: mongo:7
    container_name: reejuven8-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reejuven8
      MONGO_INITDB_ROOT_USERNAME: reejuven8
      MONGO_INITDB_ROOT_PASSWORD: dev_password
    volumes:
      - mongodb-data:/data/db
      - ./init-scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  redis:
    image: redis:7-alpine
    container_name: reejuven8-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass dev_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: reejuven8-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - reejuven8-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: reejuven8-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - reejuven8-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: reejuven8-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: reejuven8
      RABBITMQ_DEFAULT_PASS: dev_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reejuven8-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: reejuven8-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - reejuven8-network

  zipkin:
    image: openzipkin/zipkin:3
    container_name: reejuven8-zipkin
    ports:
      - "9411:9411"
    networks:
      - reejuven8-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: reejuven8-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: dev_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - reejuven8-network

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
